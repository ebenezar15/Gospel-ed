<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Logos Atlas</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <meta name="description" content="Logos Atlas — an interactive, animated atlas of Bible people, journeys, books, gospel history and theological debate." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Serif:wght@400&display=swap">
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('logos-ui') || '{}').state || {};
        if (s.scheme) document.documentElement.dataset.scheme = s.scheme;
        if (s.mode && s.mode !== 'system') document.documentElement.dataset.mode = s.mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
